<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="50%" style="stop-color:#00AAFF"/>
      <stop offset="100%" style="stop-color:#0055DD"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0F0FF"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Floating particles -->
  <circle cx="150" cy="100" r="4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="1050" cy="150" r="6" fill="rgba(255,255,255,0.4)"/>
  <circle cx="200" cy="500" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="1000" cy="450" r="4" fill="rgba(255,255,255,0.35)"/>
  <circle cx="600" cy="80" r="3" fill="rgba(255,255,255,0.25)"/>
  <circle cx="400" cy="550" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="800" cy="520" r="4" fill="rgba(255,255,255,0.35)"/>
  
  <!-- Geometric shapes -->
  <circle cx="100" cy="200" r="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <rect x="1050" y="400" width="60" height="60" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" transform="rotate(45, 1080, 430)"/>
  <polygon points="180,480 210,520 150,520" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Logo icon -->
  <g transform="translate(520, 180)">
    <rect width="80" height="80" rx="16" fill="white"/>
    <path d="M28 25L15 40L28 55" stroke="#0066FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 25L65 40L52 55" stroke="#0066FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 20L35 60" stroke="#0066FF" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Company name -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    SiteShop<tspan fill="#00CCFF">.md</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    Dezvoltare Web • Aplicații Mobile • Soluții Digitale
  </text>
  
  <!-- Bottom stats bar -->
  <rect x="200" y="480" width="800" height="1" fill="rgba(255,255,255,0.2)"/>
  
  <text x="300" y="540" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">12+</text>
  <text x="300" y="570" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle">Ani Experiență</text>
  
  <text x="500" y="540" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">200+</text>
  <text x="500" y="570" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle">Proiecte Livrate</text>
  
  <text x="700" y="540" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">50+</text>
  <text x="700" y="570" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle">Clienți Activi</text>
  
  <text x="900" y="540" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">98%</text>
  <text x="900" y="570" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle">Satisfacție</text>
</svg>

